name: Extract and validate NAISO-LIVE M15 release

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/unpack-m15-release.yml"
      - "NAISO-LIVE-M15-radar.zip"
  push:
    branches: [main]
    paths:
      - ".github/workflows/unpack-m15-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-m15-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract archive safely into repository root
        shell: bash
        run: |
          set -euo pipefail
          archive="NAISO-LIVE-M15-radar.zip"
          test -s "$archive"
          python - <<'PY'
          import zipfile
          from pathlib import PurePosixPath
          archive = "NAISO-LIVE-M15-radar.zip"
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              for info in z.infolist():
                  p = PurePosixPath(info.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe archive path: {info.filename}")
          PY
          tmp="$(mktemp -d)"
          unzip -q "$archive" -d "$tmp"
          test -d "$tmp/NAISO-LIVE-M15"
          rsync -a --exclude='GGP_RELEASE_9_LONG_RUN_STABILITY_HARDENED.zip' "$tmp/NAISO-LIVE-M15/" ./
          rm -rf "$tmp"
          rm -f "$archive"
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          test -s ggpbot.py
          test -s requirements.txt
          test -s m15_crossover_radar.py
          test -s test_m15_crossover_radar.py
          test -s test_m15_discovery_frames.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all Python modules
        run: python -m compileall -q .

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Publish extracted source tree on main after successful main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit."
            exit 0
          fi
          git commit -m "Extract and install NAISO-LIVE M15 project"
          git push origin HEAD:main
